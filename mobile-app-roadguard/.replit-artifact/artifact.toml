kind = "mobile"
previewPath = "/"
title = "PotHoleRadar"
description = "A cross-platform mobile app for crowdsourced pothole detection and reporting, with camera and sensor reports, AI-assisted severity, a shared map and feed, offline queuing, and reporter profiles."
version = "1.0.0"
id = "artifacts/pothole-radar"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19820

[services.development]
run = "pnpm --filter @workspace/pothole-radar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pothole-radar", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pothole-radar", "run", "serve" ]

[services.env]
PORT = "19820"
BASE_PATH = "/"
